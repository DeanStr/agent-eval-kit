id: writing
title: Writing style and taste
weight: 100
description: Compare passages directly, using a reference to express the desired taste.
scenarios: []
rubric:
  - id: TARGET-STYLE
    criterion: Which of A and B has the more natural and convincing authorial voice for an engineering blog?
    passCriteria: The candidate voice is at least as natural and convincing as the reference voice. Editorial polish cannot compensate for weaker voice.
    weight: 1
    gate: true
    tags: [writing, taste]
    grader:
      type: text-pairwise
      candidate: candidate.md
      references: [{ file: reference.md }]
      policy: non_regression
      voting: { minimumVotes: 3, maximumVotes: 5, agreement: 0.8 }
  - id: REVISION-STYLE
    criterion: Which version would fit more naturally alongside R in an engineering blog, based on how the author sounds?
    passCriteria: The candidate has a more natural and convincing voice in the spirit of R than the original. Editorial polish cannot compensate for weaker voice.
    weight: 1
    gate: true
    tags: [writing, revision]
    grader:
      type: text-pairwise
      candidate: candidate.md
      references: [{ file: original.md }]
      styleTarget: { file: reference.md }
      policy: preference
      voting: { minimumVotes: 3, maximumVotes: 5, agreement: 0.8 }
