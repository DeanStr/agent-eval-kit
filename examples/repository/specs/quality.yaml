id: quality
title: Repository quality
weight: 100
description: The repository is documented, type-safe, tested, and buildable.
scenarios:
  - id: REPO-S1
    name: Trace architecture and developer workflow
    kind: workspace
    instructions: |
      Inspect the repository structure, package scripts, configuration, and tests. Trace one important
      flow from its entry point through the implementation. Use only workspace listing, reading, and searching tools. Executable checks run separately through command graders.
    successSignals: [Architecture claims cite files and lines, Developer commands are discoverable]
rubric:
  - id: REPO-01
    criterion: The architecture and developer workflow are documented and agree with the implementation
    weight: 2
    tags: [documentation, maintainability]
    scenarios: [REPO-S1]
    grader: { type: llm }
    passCriteria: A contributor can find the architecture, install, test, and build workflow, and evidence shows the docs match source and scripts.
  - id: REPO-02
    criterion: Static type checking passes
    weight: 3
    tags: [correctness, types]
    scenarios: []
    grader: { type: command, methodFiles: [package.json, pnpm-lock.yaml, tsconfig.json], output: exit-code, command: pnpm typecheck, timeoutSeconds: 180 }
    passCriteria: The typecheck command exits zero.
  - id: REPO-03
    criterion: Automated tests pass
    weight: 3
    tags: [correctness, tests]
    scenarios: []
    grader:
      type: command
      output: exit-code
      command: pnpm test
      timeoutSeconds: 300
      methodFiles:
        - package.json
        - pnpm-lock.yaml
        - test/artifact-schemas.test.ts
        - test/auth.test.ts
        - test/baselines.test.ts
        - test/browser-elements.test.ts
        - test/browser-mcp.test.ts
        - test/campaign-compare.test.ts
        - test/campaign.test.ts
        - test/cancellation.test.ts
        - test/cases-splits.test.ts
        - test/ci.test.ts
        - test/cli.test.ts
        - test/command-collector.test.ts
        - test/command-inputs.test.ts
        - test/compare.test.ts
        - test/config-specs.test.ts
        - test/credentials.test.ts
        - test/doctor.test.ts
        - test/evidence-mcp.test.ts
        - test/first-run.test.ts
        - test/graders.test.ts
        - test/init.test.ts
        - test/integrity.test.ts
        - test/io.test.ts
        - test/judge-contracts.test.ts
        - test/lifecycle.test.ts
        - test/platform.test.ts
        - test/process.test.ts
        - test/prompts.test.ts
        - test/providers.test.ts
        - test/public-export.test.ts
        - test/receipts.test.ts
        - test/report-finalize.test.ts
        - test/run-lock.test.ts
